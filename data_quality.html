<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Data Quality</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
  body {
    background: #f3f4f6;
    padding: 24px;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ============================================
     UBER PALETTE
     ============================================ */
  :root {
    --uber-black: #000000;
    --uber-white: #FFFFFF;
    --uber-blue: #276EF1;
    --uber-green: #3AA76D;
    --uber-yellow: #FFC043;
    --uber-red: #D44333;
  }

  /* --- Hero card --- */
  .hero-card {
    background: var(--uber-blue);
    color: var(--uber-white);
    border-radius: 16px;
    padding: 28px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 4px;
    box-shadow: 0 4px 20px rgba(39,110,241,0.25);
    max-width: 320px;
  }
  .hero-card .check { font-size: 32px; line-height: 1; margin-bottom: 4px; }
  .hero-card .hero-number { font-size: 44px; font-weight: 700; line-height: 1; }
  .hero-card .hero-label { font-size: 14px; font-weight: 600; opacity: 0.95; }
  .hero-card .hero-sub { font-size: 11px; opacity: 0.8; }
</style>
</head>
<body>

  <div class="hero-card">
    <div class="check">✅</div>
    <div class="hero-number">100%</div>
    <div class="hero-label">Data Completeness</div>
    <div class="hero-sub">168 records · 8 cities · 21 months · no missing values</div>
  </div>

</body>
</html>
