<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Demo</title>
<style>
  /* ============================================
     CONFIGURE HERE: palette (Uber)
     ============================================ */
  :root {
    --uber-blue: #276EF1;
    --uber-blue-dark: #1E54BD;
    --uber-blue-tint: #EAF1FE;
    --uber-black: #121212;
    --uber-gray-100: #F6F6F8;
    --uber-gray-200: #E7E8EC;
    --uber-gray-400: #ADADAD;
    --uber-gray-600: #6B7280;
    --sidebar-width: 240px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
  body { background: var(--uber-gray-100); min-height: 100vh; }

  /* --- Login screen --- */
  #login-screen {
    position: relative;
    display: flex; align-items: center; justify-content: center; min-height: 100vh;
    overflow: hidden;
    background: #0a0a0a;
  }
  #login-bg {
    position: absolute; top:0; left:0; right:0; bottom:0;
    background-image: url('login-bg.jpg');
    background-size: cover;
    background-position: center;
    animation: bgZoom 12s ease-out forwards;
  }
  #login-bg::after {
    content: "";
    position: absolute; top:0; left:0; right:0; bottom:0;
    background: linear-gradient(180deg, rgba(10,10,15,0.55) 0%, rgba(10,15,30,0.75) 100%);
  }
  @keyframes bgZoom {
    from { transform: scale(1.08); }
    to { transform: scale(1); }
  }

  #login-box {
    position: relative;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 40px;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    width: 320px;
    text-align: center;

    opacity: 0;
    transform: translateY(18px) scale(0.97);
    animation: loginReveal 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    animation-delay: 1.1s;
  }
  @keyframes loginReveal {
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  #login-box .login-logo { width: 40px; height: 40px; margin: 0 auto 16px auto; display: block; }
  #login-box h1 { font-size: 20px; margin-bottom: 4px; color: #111; }
  #login-box p { font-size: 13px; color: var(--uber-gray-600); margin-bottom: 20px; }
  #login-box input {
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 12px;
    border: 1px solid var(--uber-gray-200);
    border-radius: 8px;
    font-size: 14px;
    background: white;
  }
  #login-box input:focus { outline: none; border-color: var(--uber-blue); }
  #login-box button {
    width: 100%;
    padding: 10px;
    background: var(--uber-blue);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  #login-box button:hover { background: var(--uber-blue-dark); }
  #error-msg { color: #D44333; font-size: 13px; margin-top: 8px; display: none; }

  /* --- App shell --- */
  #app-shell { display: none; min-height: 100vh; }
  #app-shell.visible { display: flex; }

  /* Sidebar */
  #sidebar {
    width: var(--sidebar-width);
    flex-shrink: 0;
    background: white;
    border-right: 1px solid var(--uber-gray-200);
    display: flex;
    flex-direction: column;
    padding: 24px 16px;
    height: 100vh;
    position: sticky;
    top: 0;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; margin-bottom: 32px; }
  .brand img { width: 28px; height: 28px; }
  .brand span { font-size: 17px; font-weight: 700; color: var(--uber-black); letter-spacing: -0.2px; }

  .nav-label { font-size: 11px; color: var(--uber-gray-400); text-transform: uppercase; letter-spacing: 0.5px; padding: 0 8px; margin-bottom: 8px; font-weight: 600; }
  .nav-list { list-style: none; margin-bottom: 24px; }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px;
    border-radius: 10px;
    color: #374151;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    margin-bottom: 4px;
    transition: background 0.15s;
  }
  .nav-item .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--uber-gray-400); flex-shrink: 0; }
  .nav-item:hover { background: var(--uber-gray-100); }
  .nav-item.active { background: var(--uber-blue); color: white; }
  .nav-item.active .dot { background: white; }

  .sidebar-spacer { flex: 1; }
  .user-chip { display: flex; align-items: center; gap: 10px; padding: 10px 8px; border-top: 1px solid var(--uber-gray-200); margin-top: 8px; }
  .user-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--uber-blue-tint); color: var(--uber-blue); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; flex-shrink: 0; }
  .user-info { flex: 1; min-width: 0; }
  .user-info .name { font-size: 13px; font-weight: 600; color: #111; }
  .user-info .action { font-size: 12px; color: var(--uber-gray-600); cursor: pointer; }
  .user-info .action:hover { color: var(--uber-blue); }

  /* Main area */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 32px;
    background: white;
    border-bottom: 1px solid var(--uber-gray-200);
  }
  #topbar .title-block h1 { font-size: 19px; color: #111; margin-bottom: 2px; }
  #topbar .title-block .breadcrumb { font-size: 12px; color: var(--uber-gray-600); }
  #topbar .breadcrumb .current { color: var(--uber-blue); font-weight: 600; }
  #topbar .top-actions { display: flex; align-items: center; gap: 10px; }
  .icon-btn {
    width: 34px; height: 34px; border-radius: 50%;
    border: 1px solid var(--uber-gray-200);
    background: white;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 14px; color: var(--uber-gray-600);
  }
  .icon-btn:hover { border-color: var(--uber-blue); color: var(--uber-blue); }

  #content-frame-wrap { flex: 1; padding: 24px 32px; }
  #content-frame { width: 100%; height: 100%; min-height: calc(100vh - 140px); border: none; }
</style>
</head>

<script>
  // ============================================
  // CONFIGURE HERE: demo username and password
  // ============================================
  const USERNAME = "demo";
  const PASSWORD = "demo123";

  function verifyLogin() {
    const username = document.getElementById('input-username').value;
    const password = document.getElementById('input-password').value;
    const errorMsg = document.getElementById('error-msg');

    if (username === USERNAME && password === PASSWORD) {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app-shell').classList.add('visible');
      openSection('dashboard.html', 'Dashboard', 'Reports');
      sessionStorage.setItem('loggedIn', 'true');
    } else {
      errorMsg.style.display = 'block';
    }
  }

  function openSection(file, title, group) {
    document.getElementById('content-frame').src = file;
    document.getElementById('content-title').textContent = title;
    document.getElementById('breadcrumb-current').textContent = title;
    document.getElementById('breadcrumb-section').textContent = group;

    document.querySelectorAll('.nav-item').forEach(function(el) { el.classList.remove('active'); });
    if (file === 'dashboard.html') {
      document.getElementById('nav-dashboard').classList.add('active');
    } else {
      document.getElementById('nav-dataquality').classList.add('active');
    }

    sessionStorage.setItem('section', file);
  }

  function logOut() {
    sessionStorage.removeItem('loggedIn');
    sessionStorage.removeItem('section');
    location.reload();
  }

  window.onload = function() {
    if (sessionStorage.getItem('loggedIn') === 'true') {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app-shell').classList.add('visible');
      const section = sessionStorage.getItem('section') || 'dashboard.html';
      if (section === 'dashboard.html') {
        openSection('dashboard.html', 'Dashboard', 'Reports');
      } else {
        openSection('data_quality.html', 'Data Quality', 'Reports');
      }
    }
  };

  document.addEventListener('keypress', function(e) {
    if (e.key === 'Enter' && document.getElementById('login-screen').style.display !== 'none') {
      verifyLogin();
    }
  });
</script>
