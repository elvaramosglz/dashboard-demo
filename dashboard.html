  .dashboard-grid {
    display: grid;
    grid-template-columns: 1.3fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 16px;
    height: calc(100vh - 40px);
  }
  .panel {
    background: white;

    padding: 12px;
    overflow: hidden;
  }
  .panel-left { grid-column: 1; grid-row: 1 / 3; }
  .panel-top-right { grid-column: 2; grid-row: 1; }
  .panel-bottom-right { grid-column: 2; grid-row: 2; }
  .panel > div { width: 100% !important; height: 100% !important; }
</style>
